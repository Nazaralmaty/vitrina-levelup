<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7FA8">
<meta name="description" content="Level Up · платформа между занятиями: видеоуроки, задания, словарь и игры.">
<title>Level Up · платформа</title>
<link rel="icon" href="assets/brand-logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="app/style.css">
<link rel="stylesheet" href="app/brand.css">
</head>
<body>
  <div class="app"><main class="view" id="view"></main></div>
  <nav class="tabs off" id="tabs"></nav>
  <div class="cta-float" id="cta">
    <a id="cta-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4 0-.5.1-.7l.5-.6c.1-.2.1-.4 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.2-.7.3-.9.9-1.1 2.2-.2 3.9a12 12 0 0 0 4.5 4.2c1.7.8 2.4.9 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.1-.5-.3z"/></svg>
    </a>
    <a id="cta-ig" class="ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>
  <script src="config.js"></script>
  <script src="app/course.js"></script>
  <script src="app/words_bridge.js"></script>
  <script src="app/app.js"></script>
  <script>
    /* Кнопки связи из конфига. Текст сообщения едет в WhatsApp готовым. */
    (function () {
      var B = window.BRAND || {};
      var wa = document.getElementById('cta-wa'), ig = document.getElementById('cta-ig');
      if (wa && B.whatsapp) wa.href = 'https://wa.me/' + B.whatsapp + '?text=' + encodeURIComponent(B.waText || '');
      if (ig && B.instagram) ig.href = B.instagram;
      document.title = (B.name || 'Level Up') + ' · платформа';
    })();
    var secure = location.protocol === 'https:' ||
                 location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator && secure) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
